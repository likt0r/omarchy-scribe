name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README claims. Running both ends keeps that
        # claim tested rather than merely asserted.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Runs the CLI tests, the backend contract tests, Model.js and the
      # manifest checks. qmllint is absent here, so the QML syntax check
      # reports itself as skipped rather than passing silently. No test
      # reaches the network or needs an API key.
      - name: All tests
        run: ./tests/run-tests.sh
